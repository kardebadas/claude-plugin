name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin:
    name: plugin structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./tools/check-plugin.sh
      - run: ./tools/check-plugin-mutants.sh

  craftui:
    name: craft UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./tools/test-craftui.sh
