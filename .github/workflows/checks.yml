name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin:
    name: plugin structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./tools/check-plugin.sh
      # `--run` is a second mode with arms of its own, and the no-argument
      # invocation above never enters it. Before this line the only thing that
      # ever ran it was the mutant harness's own baseline, so a break in the
      # mode would have surfaced as a harness abort rather than as itself.
      - run: ./tools/check-plugin.sh --run tools/fixtures/run-ok
      - run: ./tools/check-plugin-mutants.sh

  craft-brief:
    name: craft completion check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s plugins/superb/skills/craft/tests -v

  craftui:
    name: craft UI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install a browser that can actually render
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq chromium-browser || sudo apt-get install -y -qq chromium

      # The suite skips browser tests when no browser can render, so a laptop
      # without chromium does not turn red. In CI that same skip would be a
      # silent green over the tests that matter most, so assert it here.
      - name: Assert a browser is usable
        working-directory: plugins/superb/skills/craft/ui
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "tests")
          import test_server as t
          browser, why = t.usable_browser()
          if not browser:
              print("::error::browser tests would be SKIPPED in CI: %s" % why)
              sys.exit(1)
          print("browser tests will run against %s" % browser)
          PY

      - run: ./tools/test-craftui.sh
